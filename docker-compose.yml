services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animatai
      POSTGRES_USER: animatai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animatai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animatai -d animatai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
